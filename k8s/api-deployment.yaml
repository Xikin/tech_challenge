apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-api
  namespace: oficina
  labels:
    app: oficina-api
    app.kubernetes.io/name: oficina-api
    app.kubernetes.io/part-of: oficina
spec:
  # `replicas` foi REMOVIDO de propósito. Quem é dono da escala é o HPA
  # (k8s/hpa.yaml). Se este campo existisse, todo `kubectl apply` devolveria a
  # contagem para o valor do manifesto, desfazendo o autoscaling — era o que
  # acontecia na Fase 2.
  selector:
    matchLabels:
      app: oficina-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0 # nenhuma janela sem capacidade durante o deploy
      maxSurge: 1
  template:
    metadata:
      labels:
        app: oficina-api
        app.kubernetes.io/name: oficina-api
    spec:
      # Sem imagePullSecrets: a imagem vem do ECR da própria conta e os nós a
      # puxam com a role deles (AmazonEC2ContainerRegistryReadOnly). O pull
      # secret do GHCR usado na Fase 2 era criado com o GITHUB_TOKEN, que expira
      # ao fim do job — pods agendados depois em nós novos falhavam no pull.
      # Dá tempo ao encerramento gracioso do Node (ver src/server.ts) para
      # drenar as requisições em voo antes do SIGKILL.
      terminationGracePeriodSeconds: 45
      # Espalha as réplicas entre nós: duas réplicas no mesmo nó não sobrevivem
      # à perda dele.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: oficina-api
      containers:
        - name: oficina-api
          image: DOCKER_IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: oficina-config
          env:
            # --- Segredos ---
            # DATABASE_URL agora aponta para o RDS gerenciado e vem inteira do
            # Secret, escrita pelo pipeline a partir do SSM. Na Fase 2 ela era
            # montada a partir de POSTGRES_USER/PASSWORD apontando para o
            # Service `postgres` dentro do cluster.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: oficina-secret
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oficina-secret
                  key: JWT_SECRET
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: oficina-secret
                  key: SMTP_HOST
                  optional: true
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: oficina-secret
                  key: SMTP_USER
                  optional: true
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: oficina-secret
                  key: SMTP_PASS
                  optional: true
            # --- Observabilidade ---
            - name: NEW_RELIC_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: oficina-secret
                  key: NEW_RELIC_LICENSE_KEY
                  optional: true
            - name: APP_VERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app.kubernetes.io/version']
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            # `requests` não é opcional: o HPA calcula utilização como
            # uso/request. Sem request definido, o HPA de CPU não funciona.
            requests:
              memory: "256Mi" # o agente New Relic sozinho ocupa ~30MB
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false # o Prisma escreve engines em /tmp
            runAsNonRoot: true
            # UID/GID numéricos são obrigatórios junto com runAsNonRoot: a imagem
            # declara `USER appuser` por nome, e sem o número o kubelet não
            # consegue provar que não é root e recusa o container com
            # CreateContainerConfigError. 100/101 são os ids que
            # `adduser -S`/`addgroup -S` atribuem no Dockerfile.
            runAsUser: 100
            runAsGroup: 101
            capabilities:
              drop: ["ALL"]
          # Startup: cobre a janela de `prisma migrate deploy` no start.
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 3
          # Readiness usa o healthcheck PROFUNDO: se o RDS ficar inacessível,
          # o pod sai do balanceamento em vez de responder 500 ao usuário.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          # Liveness usa o healthcheck RASO, de propósito: se apontasse para o
          # /health/ready, uma indisponibilidade do banco reiniciaria todos os
          # pods em cascata sem resolver nada.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
