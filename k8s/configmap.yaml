apiVersion: v1
kind: ConfigMap
metadata:
  name: oficina-os-config
  namespace: oficina
data:
  NODE_ENV: "production"
  PORT: "3000"
  HOST: "0.0.0.0"
  JWT_EXPIRES_IN: "8h"
  BCRYPT_ROUNDS: "12"
  SMTP_PORT: "587"
  SMTP_FROM: "Oficina Mecânica <noreply@oficina.com>"
  ALLOWED_ORIGINS: ""
  LOG_LEVEL: "info"
  NEW_RELIC_APP_NAME: "oficina-os"
  SWAGGER_ENABLED: "true"

  REDIS_URL: "redis://oficina-os-redis:6379"
  RABBITMQ_EXCHANGE: "oficina.saga"
  MENSAGERIA_MAX_TENTATIVAS: "5"
  MENSAGERIA_ATRASO_RETENTATIVA_MS: "5000"
  OUTBOX_INTERVALO_MS: "1000"
