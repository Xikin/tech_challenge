apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-os-redis
  namespace: oficina
  labels:
    app: oficina-os-redis
    app.kubernetes.io/part-of: oficina
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oficina-os-redis
  template:
    metadata:
      labels:
        app: oficina-os-redis
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          args:
            - "--save"
            - ""
            - "--appendonly"
            - "no"
            - "--maxmemory"
            - "96mb"
            - "--maxmemory-policy"
            - "allkeys-lru"
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: "25m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 999
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: oficina-os-redis
  namespace: oficina
spec:
  selector:
    app: oficina-os-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: oficina-os-redis
  namespace: oficina
spec:
  podSelector:
    matchLabels:
      app: oficina-os-redis
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: oficina-os
      ports:
        - port: 6379
