# EXEMPLO da estrutura do Secret. NÃO coloque valores reais aqui.
#
# Em produção o Secret é criado pelo pipeline de deploy
# (.github/workflows/ci-cd.yml), que lê a DATABASE_URL do SSM Parameter Store —
# escrita pelo Terraform do repositório oficina-infra-db — e os demais valores
# dos GitHub Secrets. A senha do banco nunca é digitada nem versionada.
#
# Para criar manualmente durante um diagnóstico:
#
#   DATABASE_URL=$(aws ssm get-parameter \
#     --name /oficina/prod/db/database_url \
#     --with-decryption --query Parameter.Value --output text)
#
#   kubectl create secret generic oficina-secret --namespace=oficina \
#     --from-literal=DATABASE_URL="$DATABASE_URL" \
#     --from-literal=JWT_SECRET="<segredo do login interno>" \
#     --from-literal=JWT_CLIENTE_SECRET="<o MESMO segredo configurado na Lambda>" \
#     --from-literal=NEW_RELIC_LICENSE_KEY="<chave de ingestão>" \
#     --from-literal=SMTP_HOST="" \
#     --from-literal=SMTP_USER="" \
#     --from-literal=SMTP_PASS="" \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: oficina-secret
  namespace: oficina
type: Opaque
stringData:
  # Connection string completa do RDS. Substituiu POSTGRES_USER/POSTGRES_PASSWORD
  # da Fase 2, quando o Postgres era um Deployment dentro do cluster.
  DATABASE_URL: "postgresql://oficina:<senha>@<endpoint-do-rds>:5432/oficina_db?schema=public"
  # Assina o login interno (ADMIN/FUNCIONARIO). Nunca é compartilhado com a Lambda.
  JWT_SECRET: "<segredo-com-minimo-32-caracteres>"
  # Valida os tokens de CLIENTE emitidos pela Lambda de autenticação por CPF.
  # IDÊNTICO ao da Lambda e DIFERENTE do JWT_SECRET (ver docs/adr/0011).
  JWT_CLIENTE_SECRET: "<outro-segredo-com-minimo-32-caracteres>"
  NEW_RELIC_LICENSE_KEY: "<chave-de-ingestao-do-new-relic>"
  SMTP_HOST: "<smtp.exemplo.com>"
  SMTP_USER: "<usuario-smtp>"
  SMTP_PASS: "<senha-smtp>"
