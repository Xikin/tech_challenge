# Este arquivo é apenas um EXEMPLO da estrutura do Secret.
# NÃO adicione valores reais aqui — o Secret é criado via script ou Terraform.
#
# Para criar localmente (kubectl):
#   kubectl create secret generic oficina-secret --namespace=oficina \
#     --from-literal=POSTGRES_PASSWORD="..." \
#     --from-literal=JWT_SECRET="..." \
#     --from-literal=SMTP_HOST="" \
#     --from-literal=SMTP_USER="" \
#     --from-literal=SMTP_PASS="" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# Para criar via CI/CD (GitHub Actions):
#   Os valores vêm dos GitHub Secrets e são aplicados no job de deploy.
apiVersion: v1
kind: Secret
metadata:
  name: oficina-secret
  namespace: oficina
type: Opaque
stringData:
  POSTGRES_PASSWORD: "<senha-segura>"
  JWT_SECRET: "<segredo-com-minimo-32-caracteres>"
  SMTP_HOST: "<smtp.exemplo.com>"
  SMTP_USER: "<usuario-smtp>"
  SMTP_PASS: "<senha-smtp>"
