sonar.projectKey=oficina-os
sonar.projectName=Oficina — OS Service
sonar.projectVersion=2.0.0
sonar.sources=src
sonar.tests=tests
sonar.language=ts
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/*.test.ts,\
  **/coverage/**,\
  **/prisma/migrations/**

sonar.test.inclusions=**/*.test.ts
sonar.sourceEncoding=UTF-8

sonar.coverage.exclusions=src/server.ts,src/config/prisma.ts
